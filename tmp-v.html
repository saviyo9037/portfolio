<!doctype html><html><body><iframe id="f" src="/" style="width:1440px;height:900px;border:0"></iframe><pre id="r">wait</pre><script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{await wait(15000);const w=document.getElementById('f').contentWindow;const d=w.document;const out=[];
const IDS=['introduction','about','experience','skills','projects','education','contact'];
const shown=()=>IDS.filter(i=>d.getElementById(i)).join(',')||'none';
out.push('first load: '+shown()+' | tech-stack strip: '+!!d.getElementById('home-stack-title')+' | stack tiles: '+d.querySelectorAll('#home-stack-title ~ *').length+' | tiles='+[...d.querySelectorAll('section[aria-labelledby=home-stack-title] li')].length);
[...d.querySelectorAll('nav button')].find(b=>b.textContent.trim()==='Projects').click();await wait(1200);
out.push('after Projects click: '+shown()+' | stack strip still shown: '+!!d.getElementById('home-stack-title'));
[...d.querySelectorAll('nav button')].find(b=>b.textContent.trim()==='Home').click();await wait(1200);
out.push('back Home: '+shown()+' | strip: '+!!d.getElementById('home-stack-title'));
document.getElementById('r').textContent=out.join('\n')})()
</script></body></html>
